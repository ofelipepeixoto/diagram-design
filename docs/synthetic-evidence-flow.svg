<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Exemplo sintético de revisão de fontes">
  <title>Fluxo sintético de evidência</title>
  <desc>Registro bibliográfico passa por revisão humana antes de gerar evidência elegível. Não representa implantação real.</desc>
  <rect width="720" height="200" fill="#f5f5f5"/>
  <rect x="20" y="55" width="190" height="80" fill="#ffffff" stroke="#2d3142"/>
  <rect x="260" y="55" width="200" height="80" fill="#ffffff" stroke="#bf4520"/>
  <rect x="510" y="55" width="190" height="80" fill="#ffffff" stroke="#2d3142"/>
  <line x1="210" y1="95" x2="260" y2="95" stroke="#2d3142" stroke-width="2"/>
  <line x1="460" y1="95" x2="510" y2="95" stroke="#2d3142" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-size="18" fill="#2d3142">Metadados DOI</text>
  <text x="360" y="100" text-anchor="middle" font-size="18" fill="#2d3142">Revisão humana</text>
  <text x="605" y="100" text-anchor="middle" font-size="18" fill="#2d3142">Evidência elegível</text>
  <text x="20" y="175" font-size="16" fill="#2d3142">Fixture: DOI registrado não comprova uma alegação.</text>
</svg>
